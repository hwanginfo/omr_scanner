name: omr_scanner
description: 离线OMR答题卡扫描阅卷APP — 纯安卓APK
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 本地数据库
  sqflite: ^2.3.0
  path: ^1.8.3

  # 文件操作
  path_provider: ^2.1.1
  open_filex: ^4.3.4

  # 图像处理
  image: ^4.1.3
  flutter_document_scanner: ^1.1.2

  # PDF生成
  pdf: ^3.10.7
  printing: ^5.11.1

  # Excel导出
  excel: ^2.1.0

  # 图表
  fl_chart: ^0.66.2

  # 文件分享
  share_plus: ^7.2.1

  # 工具
  intl: ^0.19.0
  csv: ^5.1.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
