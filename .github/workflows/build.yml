name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - uses: actions/checkout@v4

      - run: flutter --version

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: List APK output
        run: find . -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        with:
          name: omr-scanner-debug-apk
          path: "**/app-debug.apk"
